<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DA1F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Terminal box -->
  <rect x="10" y="10" width="100" height="100" rx="12" ry="12" fill="url(#grad1)" />
  <!-- Terminal header dots -->
  <circle cx="30" cy="28" r="4" fill="#ff5f56" />
  <circle cx="44" cy="28" r="4" fill="#ffbd2e" />
  <circle cx="58" cy="28" r="4" fill="#27c93f" />
  <!-- Terminal cursor/prompt -->
  <text x="25" y="72" font-family="monospace" font-size="30" font-weight="bold" fill="#fff">&gt;_</text>
  <!-- Plugin name -->
  <text x="130" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#1A1A2E">packer-plugin</text>
  <text x="130" y="90" font-family="monospace" font-size="36" font-weight="bold" fill="#0D47A1">SIMH</text>
</svg>
